services:
  - type: web
    name: hermesboost-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: LLM_PROVIDER_MODE
        value: live
      - key: AUTH_MODE
        value: dev
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://hermesboost-frontend.onrender.com"]'

  - type: worker
    name: hermesboost-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # concurrency=1 -- each worker process independently loads FLAML/XGBoost/
    # LightGBM/scikit-learn/pandas/numpy, so 2 processes doubled the resident
    # memory before any task-specific data; that was OOM-killing the worker
    # mid-run (memory+CPU spikes at the exact moment logs went silent).
    startCommand: celery -A app.celery_app worker --loglevel=info --concurrency=1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: LLM_PROVIDER_MODE
        value: live
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"

  - type: cron
    name: hermesboost-scheduler
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Hourly is plenty for daily/weekly/monthly cadences. Enqueues onto the
    # existing worker via the same Celery/Redis broker -- this job's own
    # runtime is seconds (just the DB check + .delay() calls), not the
    # duration of the training/scoring work itself.
    schedule: "0 * * * *"
    startCommand: python -m scripts.dispatch_scheduled_runs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"

  - type: web
    name: hermesboost-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
